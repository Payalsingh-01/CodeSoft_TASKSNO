<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        
        <div class="main-card">
            
            <div class="top-bar">
                <button id="favorite-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
                <span class="view-title">Now Playing</span>
                <button id="autoplay-btn" class="badge-btn active-mode">Autoplay ON</button>
            </div>

            
            <div class="artwork-container">
                <img id="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80" alt="Album Art">
            </div>

            
            <div class="track-info">
                <h2 id="track-title">Midnight Echoes</h2>
                <p id="track-artist">Astraea</p>
            </div>

            
            <audio id="audio" src="song1.mp3"></audio>

            
            <div class="progress-section">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
            </div>

            
            <div class="playback-controls">
                <button id="shuffle-btn" class="icon-btn" title="Shuffle">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>
                <button id="prev-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
                <button id="play-pause-btn" class="main-play-btn">
                    <svg id="play-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button id="next-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
                <button id="repeat-btn" class="icon-btn" title="Repeat Mode">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
            </div>

            
            <div class="utility-controls">
                <div class="volume-container">
                    <button id="mute-btn" class="icon-btn">
                        <svg id="volume-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
                </div>
                
                <div class="speed-container">
                    <select id="speed-selector">
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                </div>
            </div>
        </div>

    
        <div class="playlist-card">
            <h3>Playlist</h3>
            <ul id="playlist-container">
                
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
