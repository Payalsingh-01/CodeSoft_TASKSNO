<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .dropdown-item {
            @apply flex items-center gap-2 px-4 py-2 text-sm text-slate-700 cursor-pointer hover:bg-slate-50;
        }
    </style>
</head>
<body class="bg-blue-900 text-slate-800 font-sans antialiased min-h-screen">

    
    <div class="max-w-6xl mx-auto p-4 sm:p-6 md:p-8">
        
        
        <header class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-blue-400">Spends</h1>
                <p class="text-slate-500 text-sm">Track your daily cash flow instantly.</p>
            </div>
        
            <div class="self-start sm:self-center bg-white px-4 py-2 rounded-xl shadow-xs border border-slate-100 flex items-center gap-2">
                <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                <span id="current-date" class="text-sm font-medium text-slate-600"></span>
            </div>
        </header>

       
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8">
            
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xs border border-slate-100 relative overflow-hidden">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <span class="text-sm font-medium text-slate-500">Net Balance</span>
                    <div class="p-2 bg-indigo-50 rounded-lg text-indigo-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                </div>
                <h2 id="total-balance" class="text-2xl md:text-3xl font-bold text-slate-900">₹0.00</h2>
            </div>
          
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xs border border-slate-100">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <span class="text-sm font-medium text-slate-500">Total Income</span>
                    <div class="p-2 bg-emerald-50 rounded-lg text-emerald-600"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
                </div>
                <h2 id="total-income" class="text-2xl md:text-3xl font-bold text-emerald-600">+₹0.00</h2>
            </div>
           >
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xs border border-slate-100">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <span class="text-sm font-medium text-slate-500">Total Expenses</span>
                    <div class="p-2 bg-rose-50 rounded-lg text-rose-600"><i data-lucide="trending-down" class="w-5 h-5"></i></div>
                </div>
                <h2 id="total-expenses" class="text-2xl md:text-3xl font-bold text-rose-600">-₹0.00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
            
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xs border border-slate-100 h-fit">
                <h3 class="text-lg font-semibold text-slate-900 mb-4">Add Transaction</h3>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Description</label>
                        <input type="text" id="desc" required placeholder="e.g., Groceries, Swiggy, Salary" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Amount (₹)</label>
                         
                            <input type="number" id="amount" step="0.01" inputmode="decimal" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Type</label>
                            <select id="type" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                    </div>
                  <div class="relative">
  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
    Category
  </label>


  <button id="category-btn" type="button"
    class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
    <span id="category-selected" class="flex items-center gap-2 text-slate-700">
      <i data-lucide="utensils" class="w-4 h-4"></i> Food & Dining
    </span>
    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
  </button>

  
  <ul id="category-menu"
    class="absolute z-10 mt-2 w-full bg-white border border-slate-200 rounded-xl shadow-lg hidden">
    <li data-value="Food" class="dropdown-item">
      <i data-lucide="utensils" class="w-4 h-4"></i> Food & Dining
    </li>
    <li data-value="Shopping" class="dropdown-item">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i> Shopping
    </li>
    <li data-value="Housing" class="dropdown-item">
      <i data-lucide="home" class="w-4 h-4"></i> Rent & Housing
    </li>
    <li data-value="Transport" class="dropdown-item">
      <i data-lucide="car" class="w-4 h-4"></i> Commute/Transport
    </li>
    <li data-value="Entertainment" class="dropdown-item">
      <i data-lucide="film" class="w-4 h-4"></i> Entertainment
    </li>
    <li data-value="Salary" class="dropdown-item">
      <i data-lucide="wallet" class="w-4 h-4"></i> Salary/Paycheck
    </li>
    <li data-value="Other" class="dropdown-item">
      <i data-lucide="sparkles" class="w-4 h-4"></i> Other
    </li>
  </ul>
                 </div>


                    <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl shadow-xs transition-colors flex items-center justify-center gap-2 text-sm cursor-pointer active:scale-[0.99]">
                        <i data-lucide="plus" class="w-4 h-4"></i> Log Transaction
                    </button>
                </form>
            </div>

         
            <div class="lg:col-span-2 bg-white p-5 md:p-6 rounded-2xl shadow-xs border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
                    <h3 class="text-lg font-semibold text-slate-900">Transaction History</h3>
                    
                  
                    <div class="flex flex-wrap gap-2" id="filter-container">
                        <button data-filter="all" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100 cursor-pointer">All</button>
                        <button data-filter="income" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-500 hover:bg-slate-50 cursor-pointer">Income</button>
                        <button data-filter="expense" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-500 hover:bg-slate-50 cursor-pointer">Expenses</button>
                    </div>
                </div>

               
                <div class="overflow-hidden">
                    <ul id="transaction-list" class="divide-y divide-slate-100 max-h-[450px] overflow-y-auto pr-1">
                       
                    </ul>
                    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-slate-400">
                        <i data-lucide="receipt" class="w-12 h-12 stroke-1 mb-3"></i>
                        <p class="text-sm font-medium">No transactions found.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
